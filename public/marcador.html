<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E52521">
<link rel="manifest" href="/marcador.webmanifest">
<title>Marcador · Torneo Caparazón Azul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
  /* Paleta de Super Mario: cielo, bloque ?, ladrillo, tubo verde, gorra roja */
  :root {
    --sky: #5C94FC;
    --sky-hi: #A4C8FF;
    --ink: #1B1A2E;
    --card: #FFFFFF;
    --cream: #FFF4D6;
    --muted: #5F6283;
    --red: #E52521;
    --yellow: #FBD000;
    --yellow-dk: #B87A00;
    --green: #43B047;
    --blue: #049CD8;
    --brick: #C84C0C;
    --brick-dk: #6E2604;
    --silver: #DCE2EE;
    --bronze: #F0B68A;
    --mk: #E52521;
    --tennis: #43B047;
    --smash: #F08A1C;
    --display: "Lilita One", "Arial Rounded MT Bold", "Arial Black", sans-serif;
    --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --k: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--sky); overflow: hidden; }
  body { color: var(--ink); font-family: var(--cond); -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  /* Escenario de 1920 px de ancho (o 1080 de alto) que toma la proporción de la pantalla, sin bandas */
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden;
    background: linear-gradient(180deg, var(--sky) 0%, #79A9FD 55%, var(--sky-hi) 100%); }
  .clouds { position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background:
      radial-gradient(60px 38px at 12% 34%, #fff 98%, transparent), radial-gradient(48px 34px at 15.5% 30%, #fff 98%, transparent), radial-gradient(54px 32px at 18.5% 35%, #fff 98%, transparent),
      radial-gradient(66px 40px at 74% 22%, #fff 98%, transparent), radial-gradient(52px 36px at 77.5% 18%, #fff 98%, transparent), radial-gradient(58px 34px at 81% 23%, #fff 98%, transparent),
      radial-gradient(50px 30px at 46% 62%, #fff 98%, transparent), radial-gradient(42px 28px at 48.8% 58%, #fff 98%, transparent), radial-gradient(46px 28px at 51.5% 63%, #fff 98%, transparent); }
  .hills { position: absolute; left: 0; right: 0; bottom: 70px; height: 240px; pointer-events: none; opacity: .5;
    background:
      radial-gradient(260px 200px at 8% 100%, var(--green) 98%, transparent),
      radial-gradient(200px 140px at 30% 100%, #5CC75F 98%, transparent),
      radial-gradient(320px 230px at 88% 100%, var(--green) 98%, transparent),
      radial-gradient(180px 120px at 64% 100%, #5CC75F 98%, transparent); }

  .topbar { position: relative; height: 128px; display: flex; align-items: center; gap: 26px; padding: 0 48px;
    background: linear-gradient(180deg, #F2433F, var(--red) 60%, #C81A16); border-bottom: 5px solid var(--ink); }
  .shell { width: 96px; height: auto; flex: none; filter: drop-shadow(0 4px 0 rgba(27,26,46,.5)); }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 56px; line-height: .95; color: var(--yellow); letter-spacing: .01em;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
  .brand h1 span { color: #fff; }
  .brand p { margin: 8px 0 0; font-size: 25px; font-weight: 800; color: #fff; letter-spacing: .05em; text-transform: uppercase; text-shadow: 0 2px 0 rgba(27,26,46,.45); }
  .brand p b { color: var(--yellow); }
  .pills { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .pill { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 14px; background: #fff; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    font-size: 22px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .pill b { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pill.on { background: var(--yellow); color: var(--ink); }
  .pill::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: var(--game); }
  .pill[data-g="mk"] { --game: var(--mk); } .pill[data-g="tennis"] { --game: var(--tennis); } .pill[data-g="smash"] { --game: var(--smash); }
  .live { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 14px; background: var(--green); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    font-family: var(--display); font-size: 24px; color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  .live i { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); animation: blink 1.4s infinite; }
  .live.off { background: var(--silver); color: var(--muted); -webkit-text-stroke: 0; }
  .live.off i { animation: none; }
  @keyframes blink { 50% { opacity: .2; } }
  .flag { position: relative; height: 16px; background: conic-gradient(#fff 25%, var(--ink) 0 50%, #fff 0 75%, var(--ink) 0) 0 0 / 16px 16px; border-bottom: 3px solid var(--ink); }

  main { position: absolute; top: 168px; left: 48px; right: 48px; bottom: 96px; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; animation: viewIn .55s cubic-bezier(.2,.9,.25,1.15); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(28px) scale(.98); } to { opacity: 1; transform: none; } }
  .vhead { display: flex; align-items: center; gap: 18px; padding: 0 0 12px; }
  .vhead h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .vhead .tag { font-family: var(--display); font-size: 22px; padding: 5px 14px; border-radius: 10px; background: var(--g, var(--red)); color: #fff; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
    -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  .vhead p { margin: 0 0 0 auto; font-size: 24px; font-weight: 800; color: var(--ink); background: rgba(255,255,255,.8); border: 3px solid var(--ink); padding: 4px 14px; border-radius: 10px; }

  /* Tabla de posiciones: bloques blancos con borde de caricatura */
  .board { position: relative; flex: 1; }
  .row { position: absolute; left: 0; right: 0; height: var(--rh, 50px); display: grid; align-items: center; gap: 18px; padding: 0 12px 0 10px;
    background: var(--card); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
    transition: transform .9s cubic-bezier(.2,.9,.25,1.1); }
  .board.general .row, .colhead.general { grid-template-columns: calc(64px * var(--k)) calc(44px * var(--k)) minmax(0, 1fr) 150px 150px 150px 190px; }
  .board.game .row, .colhead.game { grid-template-columns: calc(64px * var(--k)) calc(44px * var(--k)) minmax(0, 1fr) 150px 160px 170px 190px; }
  .row.r1 { background: linear-gradient(180deg, #FFE45C, var(--yellow)); }
  .row.r2 { background: var(--silver); }
  .row.r3 { background: var(--bronze); }
  .pos { justify-self: center; width: calc(46px * var(--k)); height: calc(46px * var(--k)); border-radius: 50%; display: grid; place-items: center; position: relative;
    font-family: var(--display); font-size: calc(26px * var(--k)); background: var(--cream); border: 3px solid var(--ink); font-variant-numeric: tabular-nums; }
  .r1 .pos, .r2 .pos, .r3 .pos { background: #fff; }
  .delta { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); font-family: var(--cond); font-size: 15px; font-weight: 800; white-space: nowrap; padding: 0 5px; border-radius: 6px; border: 2px solid var(--ink); color: #fff; }
  .delta.up { background: var(--green); } .delta.down { background: var(--red); }
  .av { width: calc(44px * var(--k)); height: calc(44px * var(--k)); border-radius: 10px; background: #fff; border: 2px solid var(--ink); overflow: hidden; display: grid; place-items: center; font-family: var(--display); font-size: 18px; color: #fff; }
  .av img { width: 100%; height: 100%; object-fit: contain; }
  .who { min-width: 0; display: flex; align-items: center; gap: 14px; }
  .who b { font-size: calc(32px * var(--k)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who > span { font-size: calc(21px * var(--k)); color: var(--muted); font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .r1 .who > span, .r3 .who > span { color: #5A4300; }
  .who .num { font-family: var(--display); font-size: 17px; color: #fff; background: var(--blue); border: 2px solid var(--ink); border-radius: 6px; padding: 0 6px; }
  .dots { display: inline-flex; }
  .dots i { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--ink); }
  .dots i + i { margin-left: -5px; }
  .cell { text-align: center; font-size: calc(32px * var(--k)); font-weight: 800; font-variant-numeric: tabular-nums; }
  .cell.dim { color: #A9ACC4; }
  .tot { justify-self: end; min-width: 150px; text-align: center; font-family: var(--display); font-size: calc(32px * var(--k)); line-height: 1.2; font-variant-numeric: tabular-nums;
    background: var(--ink); color: var(--yellow); border-radius: 10px; padding: 0 14px; }
  .r1 .tot { background: var(--red); color: #fff; }
  .colhead { display: grid; gap: 18px; padding: 0 12px 8px 10px; }
  .colhead span { text-align: center; font-family: var(--display); font-size: 22px; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .colhead span:last-child { text-align: right; padding-right: 36px; }
  .colhead .chip { justify-self: center; padding: 0 14px; border-radius: 10px; border: 3px solid var(--ink); background: var(--c); -webkit-text-stroke: 1.5px var(--ink); }
  .crown { font-size: 30px; line-height: 1; color: var(--red); -webkit-text-stroke: 1px var(--ink); }

  /* Smash */
  .tiers { flex: 1; display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 20px; align-items: start; }
  .tcol { display: flex; flex-direction: column; gap: 18px; }
  .tier { background: var(--card); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .tier h3 { margin: 0; display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-weight: 400; font-size: 26px; }
  .tier h3 b { font-weight: 400; font-size: 22px; color: #fff; background: var(--smash); border: 2px solid var(--ink); border-radius: 8px; padding: 0 10px; }
  .tier.champ { background: linear-gradient(180deg, #FFE45C, var(--yellow)); }
  .tier.champ h3 b { background: var(--red); }
  .sm { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center; }
  .sm .av { width: 52px; height: 52px; }
  .sm b { font-size: 30px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .sm span { display: block; font-size: 20px; color: var(--muted); font-weight: 700; }
  .tier.champ .sm { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .tier.champ .av { width: 270px; height: 270px; border-radius: 20px; border-width: 4px; box-shadow: 0 6px 0 var(--ink); }
  .tier.champ .sm b { font-size: 52px; }
  .tier.champ .sm span { color: #5A4300; }
  .empty-slot { font-size: 24px; color: #A9ACC4; font-weight: 800; padding: 6px 0; }

  /* Partida actual */
  .match { flex: 1; display: grid; grid-template-columns: 1fr 200px 1fr; align-items: center; gap: 24px; }
  .pair { background: var(--card); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 7px 0 var(--ink); padding: 34px 26px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; position: relative; }
  .pair.win { background: linear-gradient(180deg, #FFE45C, var(--yellow)); }
  .pair .plabel { position: absolute; top: -24px; left: 24px; font-family: var(--display); font-size: 24px; padding: 4px 16px; border-radius: 10px; background: var(--blue); color: #fff; border: 3px solid var(--ink); -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  .pair.win .plabel { background: var(--red); }
  .pc { display: grid; justify-items: center; gap: 10px; text-align: center; min-width: 0; }
  .pc .av { width: 240px; height: 240px; border-radius: 20px; border-width: 4px; font-size: 64px; }
  .pc b { font-size: 46px; font-weight: 800; line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc span { font-size: 24px; color: var(--muted); font-weight: 700; display: flex; gap: 10px; align-items: center; }
  .pair.win .pc span { color: #5A4300; }
  .pc .res { font-family: var(--cond); font-weight: 800; font-size: 40px; line-height: 1; color: var(--ink); }
  .pc .res small { font-size: 24px; color: var(--muted); margin-left: 6px; }
  .vs { text-align: center; font-family: var(--display); }
  .vs .big { font-size: 110px; line-height: 1; color: var(--yellow); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); }
  .vs .score { font-size: 120px; line-height: 1; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); }
  .vs .bonus { margin-top: 14px; font-family: var(--cond); font-size: 26px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 2px 10px; display: inline-block; }
  .next { margin: 26px auto 0; font-size: 28px; color: var(--ink); font-weight: 700; text-align: center; background: rgba(255,255,255,.88); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 20px; }

  /* Piso de ladrillos */
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: flex; align-items: center; gap: 22px; padding: 0 48px; border-top: 4px solid var(--ink);
    background:
      linear-gradient(0deg, transparent 47%, var(--brick-dk) 47% 53%, transparent 53%),
      repeating-linear-gradient(90deg, transparent 0 76px, var(--brick-dk) 76px 80px),
      var(--brick); }
  .ticker .lab { font-family: var(--display); font-size: 24px; background: var(--yellow); color: var(--ink); padding: 5px 14px; border-radius: 10px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .ticker .txt { font-size: 30px; font-weight: 800; color: #fff; background: rgba(27,26,46,.78); padding: 4px 16px; border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clocks { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .tm { display: flex; align-items: baseline; gap: 8px; background: var(--ink); color: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 12px;
    font-family: var(--display); font-size: 32px; line-height: 1.15; font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .tm small { font-family: var(--cond); font-size: 16px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; }
  .tm.total { background: #fff; color: var(--ink); }
  .tm.total small { color: var(--muted); }
  .tm.paused { opacity: .75; }
  .tm.paused::after { content: "❚❚"; font-size: 16px; margin-left: 2px; }
  .vs .mclock { margin-top: 16px; display: inline-flex; align-items: baseline; gap: 8px; font-size: 44px; background: var(--ink); color: var(--yellow); border-radius: 14px; padding: 4px 16px; font-variant-numeric: tabular-nums; }
  .vs .mclock small { font-family: var(--cond); font-size: 18px; color: #fff; font-weight: 800; }
  .ticker .rot { margin-left: 0; display: flex; gap: 8px; background: rgba(27,26,46,.78); padding: 8px 10px; border-radius: 10px; }
  .ticker .rot:empty { display: none; }
  .ticker .rot i { width: 34px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.3); overflow: hidden; position: relative; }
  .ticker .rot i.on::after { content: ""; position: absolute; inset: 0; background: var(--yellow); transform-origin: left; animation: fill var(--dur, 15s) linear forwards; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* Botón de pantalla completa: se esconde solo y reaparece al tocar */
  #fs { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5; font: 800 20px var(--cond); letter-spacing: .03em;
    padding: 12px 18px; border-radius: 14px; border: 3px solid var(--ink); background: var(--yellow); color: var(--ink); box-shadow: 0 4px 0 var(--ink); cursor: pointer; transition: opacity .4s; }
  #fs.hide { opacity: 0; pointer-events: none; }
  #fs, #snd { touch-action: manipulation; -webkit-user-select: none; user-select: none; min-height: 52px; }
  #toast { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 20px); transform: translateX(-50%); z-index: 6; max-width: min(90vw, 760px);
    font: 800 20px/1.3 var(--cond); text-align: center; background: var(--ink); color: #fff; border: 3px solid #fff; border-radius: 14px; padding: 12px 18px; box-shadow: 0 6px 0 rgba(0,0,0,.4); }
  #oldbrowser { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 40px; text-align: center; font: 800 28px/1.4 var(--cond); background: var(--red); color: #fff; }
  #fs:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }

  /* Calendario de parejas */
  .cal { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(7, minmax(0, 1fr)); gap: 12px 22px; }
  .cm { display: grid; grid-template-columns: 64px minmax(0, 1fr) 52px minmax(0, 1fr) 132px; align-items: center; gap: 12px; padding: 6px 12px 6px 8px;
    background: var(--card); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); min-height: 0; }
  .cm.now { background: linear-gradient(180deg, #FFE45C, var(--yellow)); box-shadow: 0 4px 0 var(--ink), 0 0 0 4px #fff; }
  .cm.done { background: #EEF6EE; }
  .cm .mn { justify-self: center; width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-size: 28px; color: #fff;
    background: var(--blue); border: 3px solid var(--ink); -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  .cm.now .mn { background: var(--red); }
  .cm .vsm { text-align: center; font-family: var(--display); font-size: 26px; color: var(--yellow); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .cp { display: grid; gap: 4px; min-width: 0; padding: 4px 8px; border-radius: 10px; }
  .cp.win { background: var(--yellow); border: 2px solid var(--ink); }
  .cm.now .cp.win { background: #fff; }
  .cpl { display: grid; grid-template-columns: calc(34px * var(--k)) minmax(0, 1fr); gap: 8px; align-items: center; min-width: 0; }
  .cpl .av { width: calc(34px * var(--k)); height: calc(34px * var(--k)); border-radius: 8px; font-size: 13px; }
  .cpl b { font-size: calc(24px * var(--k)); font-weight: 800; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cp.r .cpl { grid-template-columns: minmax(0, 1fr) calc(34px * var(--k)); text-align: right; }
  .cp.r .cpl .av { order: 2; }
  .cst { justify-self: end; text-align: center; font-family: var(--display); font-size: 20px; padding: 4px 10px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; color: var(--muted); white-space: nowrap; }
  .cst.ok { background: var(--green); color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  .cst.now { background: var(--red); color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  .cst.score { font-size: 30px; background: var(--ink); color: var(--yellow); }

  /* JUEGA / SIGUE en la tabla */
  .deck { flex: none; font-family: var(--display); font-size: calc(17px * var(--k)); padding: 0 8px; border-radius: 8px; border: 2px solid var(--ink); color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; white-space: nowrap; }
  .who > .deck { color: #fff; font-size: calc(17px * var(--k)); }
  .deck.is-play { background: var(--red); animation: pulse 1.2s ease-in-out infinite; }
  .deck.is-next { background: var(--blue); }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  /* Podio */
  .podium { flex: 1; display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 26px; align-items: end; padding: 0 40px; }
  .step { display: grid; justify-items: center; gap: 10px; text-align: center; min-width: 0; }
  .step .av { width: 180px; height: 180px; border-radius: 22px; border-width: 4px; box-shadow: 0 6px 0 var(--ink); }
  .step.p1 .av { width: 230px; height: 230px; }
  .step b { font-size: 50px; font-weight: 800; line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .ch { font-size: 24px; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.85); border: 2px solid var(--ink); border-radius: 10px; padding: 2px 10px; display: flex; gap: 8px; align-items: center; }
  .block { width: 100%; display: grid; place-items: center; gap: 4px; border: 4px solid var(--ink); border-radius: 18px 18px 0 0; box-shadow: 0 6px 0 var(--ink); padding: 14px 0; }

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {

  const pitch = Math.max(56, Math.min(96, Math.floor(avail / 13)));

let drawKey = null, lastReveal = -1, drawDone = false, paintedBox = null, soundNum = -1, soundDone = false;
function paintDraw() {

  if (S.tournament.draw.id !== drawKey) {

let fsTimer = null;
const canFs = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const standalone = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone === true;
function showFsButton() {
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  fsBtn.textContent = isFs ? "Salir de pantalla completa" : "Pantalla completa";
  fsBtn.hidden = standalone;
  fsBtn.classList.remove("hide");
  clearTimeout(fsTimer); fsTimer = setTimeout(() => fsBtn.classList.add("hide"), 8000);
}
function toast(text) {
  const t = $("toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 6000);
}
fsBtn.addEventListener("click", async () => {
  const el = document.documentElement;
  unlockAudio();
  if (!canFs) { toast("Esta tablet no permite pantalla completa desde el navegador. En iPad: Compartir → Agregar a pantalla de inicio, y abre el marcador desde ese ícono."); return; }
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else await (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: "hide" });
  } catch (e) { toast("No se pudo activar la pantalla completa. Prueba girando la tablet o agregando el marcador a la pantalla de inicio."); }
  keepAwake();
  setTimeout(fit, 300);
});
function onTouch() { showFsButton(); showSnd(); showCtl(); keepAwake(); }
for (const ev of ["pointerdown", "touchstart", "mousedown", "keydown"]) addEventListener(ev, onTouch, { passive: true });
for (const ev of ["touchend", "click"]) addEventListener(ev, () => unlockAudio(), { passive: true });
document.addEventListener("fullscreenchange", () => { fit(); showFsButton(); });
showFsButton();
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
keepAwake();

// Sonidos estilo 8 bits, generados en el navegador (sin archivos)
let soundOn = true;
try { soundOn = localStorage.getItem("marcador-sonido") !== "no"; } catch {}
let actx = null;
function audio() {
  if (!soundOn) return null;
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) { return null; }
  return actx;
}
function tone(freq, start, dur, type = "square", vol = .12) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime + start);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + start + dur);
  o.connect(g).connect(a.destination);
  o.start(a.currentTime + start); o.stop(a.currentTime + start + dur + .02);
}
const SFX = {
  coin() { tone(988, 0, .08); tone(1319, .08, .35); },
  tick() { tone(660 + Math.random() * 300, 0, .04, "square", .05); },
  beep() { tone(880, 0, .12, "square", .1); },
  go() { tone(1760, 0, .5, "square", .12); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .12, i === 5 ? .6 : .14)); }
};
const sndBtn = $("snd");
function paintSnd() { sndBtn.textContent = soundOn ? "Sonido: activado" : "Sonido: apagado"; }
sndBtn.addEventListener("click", () => {
  soundOn = !soundOn; try { localStorage.setItem("marcador-sonido", soundOn ? "si" : "no"); } catch (e) {}
  paintSnd(); if (soundOn) { unlockAudio(); SFX.coin(); toast("Sonido activado"); } else toast("Sonido apagado");
});
paintSnd();
// iPad y algunos Android solo activan el audio al soltar el dedo: se reproduce un sonido mudo para desbloquearlo
let audioUnlocked = false;
function unlockAudio() {
  const a = audio(); if (!a || audioUnlocked) return;
  try { const b = a.createBuffer(1, 1, 22050), s = a.createBufferSource(); s.buffer = b; s.connect(a.destination); s.start(0); audioUnlocked = a.state === "running" || true; } catch (e) {}
}
function showSnd() { sndBtn.classList.remove("hide"); clearTimeout(sndBtn.t); sndBtn.t = setTimeout(() => sndBtn.classList.add("hide"), 8000); }
sndBtn.t = setTimeout(() => sndBtn.classList.add("hide"), 8000);

// Reloj de la cuenta regresiva: solo actualiza el número; al terminar vuelve a la vista normal
let lastSec = null, cdActive = false;
function paintClocks() {
  const tms = S.tournament.timers || {};
  for (const [id, key] of [["tm-match", "match"], ["tm-total", "total"]]) {
    const el = $(id), tm = tms[key];
    const show = !!tm && (tm.running || tm.acc > 0);
    el.hidden = !show;
    if (!show) continue;
    el.lastElementChild.textContent = T.fmtDuration(T.elapsed(tm));
    el.classList.toggle("paused", !tm.running);
  }
  const big = $("mclock");
  if (big) {
    const tm = tms.match, show = !!tm && (tm.running || tm.acc > 0);
    big.hidden = !show;
    if (show) big.lastElementChild.textContent = T.fmtDuration(T.elapsed(tm));
  }
}
setInterval(() => {
  if (!S) return;
  paintClocks();
  const left = countdownLeft(), active = left > -4000;
  if (active !== cdActive) { cdActive = active; lastSec = null; draw(true); return; }
  if (!active) return;
  const el = $("timer"); if (!el) return;
  const sec = Math.ceil(left / 1000);
  if (sec === lastSec) return;
  lastSec = sec;
  el.textContent = left > 0 ? fmtClock(left) : "¡A jugar!";
  el.className = "timer" + (left <= 0 ? " go" : sec <= 10 ? " hot" : "");
  if (sec > 0 && sec <= 3) SFX.beep();
  if (sec === 0) SFX.go();
}, 200);

// Celebración cuando se completa una partida o hay campeón de Smash
let seen = null, queue = [], showing = false;
function completions(state) {
  const t = state.tournament, out = new Map();
  T.SCHEDULE.forEach((_, i) => {
    if (T.mkMatch(t, i).complete) out.set("mk:" + i, { g: "mk", i });
    if (T.tennisMatch(t, i).complete) out.set("tennis:" + i, { g: "tennis", i });
  });
  for (const [n, st] of Object.entries(t.smash || {})) if (st === "campeon") out.set("smash:" + n, { g: "smash", n: +n });
  return out;
}
function celebrate(ev) {
  const t = S.tournament, box = $("celebrate");
  const card = n => h("div", { class: "pc" }, av(P[n]), h("b", {}, P[n].name), h("span", {}, dots(P[n]), charName(P[n])));
  let title, sub, who, extra = null;
  if (ev.g === "smash") { title = "¡Campeón de Smash!"; sub = "+13 pts generales"; who = [ev.n]; }
  else if (ev.g === "mk") {
    const m = T.mkMatch(t, ev.i), [A, B] = T.SCHEDULE[ev.i];
    title = `Partida ${ev.i + 1}`;
    if (m.bonus) { who = m.bonus === "A" ? A : B; sub = "¡+3 de bono!"; extra = `${m.sumA} vs ${m.sumB} puntos`; }
    else { const first = [...A, ...B].sort((a, b) => m.res[a] - m.res[b])[0]; who = [first]; sub = "¡Empate de parejas!"; extra = `Mejor puesto: ${m.res[first]}.º`; }
  } else {
    const m = T.tennisMatch(t, ev.i), [A, B] = T.SCHEDULE[ev.i];
    title = `Partida ${ev.i + 1}`; who = m.winner === "A" ? A : B; sub = `¡Ganan ${m.a}-${m.b}!`;
  }
  const coins = Array.from({ length: 26 }, () => {
    const c = h("i", { class: "coin" });
    c.style.left = Math.random() * 100 + "%";
    c.style.animationDuration = (2.2 + Math.random() * 1.8) + "s, .5s";
    c.style.animationDelay = (Math.random() * 1.2) + "s, 0s";
    return c;
  });
  box.replaceChildren(...coins, h("div", { class: "card" }, h("span", { class: "sub" }, T.GAME_SHORT[ev.g]), h("h2", {}, title),
    h("span", { class: "sub" }, sub), h("div", { class: "cwho" }, who.map(card)), extra ? h("span", { class: "extra" }, extra) : null));
  box.hidden = false;
  SFX.coin(); setTimeout(() => SFX.fanfare(), 250);
  setTimeout(() => { box.hidden = true; showing = false; if (queue.length) { showing = true; celebrate(queue.shift()); } }, 7000);
}
function checkCelebrations(state) {
  const now = completions(state);
  if (seen) for (const [k, ev] of now) if (!seen.has(k)) queue.push(ev);
  seen = new Set(now.keys());
  if (!showing && queue.length) { showing = true; celebrate(queue.shift()); }
}

let lastMode = null;
T.connect((state, chars) => {
  CH = chars; S = state;
  P = T.playersByNum(S);
  checkCelebrations(state);
  const mode = state.tournament.view + "|" + state.tournament.current.game;
  if (mode !== lastMode) { rotIdx = 0; startRotation(); }
  draw(mode !== lastMode);
  lastMode = mode;
}, ok => { $("live").classList.toggle("off", !ok); $("live").querySelector("span").textContent = ok ? "EN VIVO" : "RECONECTANDO"; });
// Controles desde la misma tablet: usan la contraseña de organizador y envían el cambio al servidor
const ctlBtn = $("ctl"), menu = $("menu");
let ctlPass = null, menuTimer = null, menuConfirm = null;
try { ctlPass = sessionStorage.getItem("torneo-admin"); } catch (e) {}
function showCtl() { ctlBtn.classList.remove("hide"); clearTimeout(ctlBtn.t); ctlBtn.t = setTimeout(() => ctlBtn.classList.add("hide"), 8000); }
ctlBtn.t = setTimeout(() => ctlBtn.classList.add("hide"), 8000);
function closeMenu() { menu.hidden = true; menuConfirm = null; clearTimeout(menuTimer); }
function touchMenu() { clearTimeout(menuTimer); menuTimer = setTimeout(closeMenu, 20000); }
async function send(mut, close = true) {
  const t = JSON.parse(JSON.stringify(S.tournament));
  mut(t);
  try {
    const res = await fetch("/api/admin/tournament", { method: "PUT", headers: { "Content-Type": "application/json", "x-admin-password": ctlPass }, body: JSON.stringify(t) });
    if (res.status === 401) { ctlPass = null; try { sessionStorage.removeItem("torneo-admin"); } catch (e) {} renderMenu("La contraseña ya no es válida. Escríbela de nuevo."); return; }
    if (!res.ok) throw new Error();
    if (close) closeMenu(); else renderMenu();
  } catch (e) { toast("No se pudo enviar. Revisa la conexión de la tablet."); }
}
function shuffleNumbers(t) {
  const nums = T.NUMS.slice();
  for (let i = nums.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = nums[i]; nums[i] = nums[j]; nums[j] = x; }
  t.numbers = {};
  S.picks.slice(0, 13).forEach((p, k) => { t.numbers[p.id] = nums[k]; });
}
function renderMenu(msg) {
  touchMenu();
  const b = (label, fn, cls, dis) => { const e = h("button", { type: "button", class: cls || "" }, label); e.disabled = !!dis; e.addEventListener("click", fn); return e; };
  const box = h("div", { class: "box" });
  box.append(h("div", { class: "mh" }, h("h2", {}, "Controles"), b("Cerrar ✕", closeMenu)));
  if (!ctlPass) {
    const inp = h("input", { type: "password", placeholder: "Contraseña de organizador", autocomplete: "current-password" });
    const enter = async () => {
      const res = await fetch("/api/admin/login", { method: "POST", headers: { "x-admin-password": inp.value } });
      if (res.ok) { ctlPass = inp.value; try { sessionStorage.setItem("torneo-admin", ctlPass); } catch (e) {} renderMenu(); }
      else renderMenu("Contraseña incorrecta.");
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
    box.append(h("p", { class: "note" }, "Escribe la contraseña de organizador para manejar la transmisión desde esta tablet."), inp, h("div", { class: "mrow" }, b("Entrar", enter, "go")));
    if (msg) box.append(h("p", { class: "note err" }, msg));
    menu.replaceChildren(box); menu.hidden = false; setTimeout(() => inp.focus(), 50); return;
  }
  const t = S.tournament, v = t.view, k = t.slide || 0;
  const assigned = Object.keys(t.numbers || {}).length;
  const hasResults = Object.keys(t.mk || {}).length + Object.keys(t.tennis || {}).length + Object.keys(t.smash || {}).length > 0;
  const doDraw = () => send(x => { shuffleNumbers(x); x.drawStart = true; x.view = "sorteo"; x.countdownSeconds = 0; });
  box.append(h("h3", {}, "Sorteo en vivo"));
  if (menuConfirm === "draw") {
    box.append(h("p", { class: "note err" }, hasResults ? "Ya hay resultados cargados: un sorteo nuevo cambia quién jugó cada partida." : "Se reemplazan los números actuales."),
      h("div", { class: "mrow" }, b("Sí, sortear", doDraw, "warn"), b("Cancelar", () => { menuConfirm = null; renderMenu(); })));
  } else {
    box.append(h("div", { class: "mrow" },
      b("Sortear en vivo", () => { if (assigned) { menuConfirm = "draw"; renderMenu(); } else doDraw(); }, "go"),
      b("Repetir animación", () => send(x => { x.drawStart = true; x.view = "sorteo"; }), "", assigned < 13)));
  }
  box.append(h("h3", {}, "Reglas"), h("div", { class: "mrow" },
    b("◀ Anterior", () => send(x => { x.view = "reglas"; x.slide = Math.max(0, k - 1); }, false), "", v !== "reglas" || k === 0),
    b(v === "reglas" ? `Regla ${k + 1} de ${T.SLIDES.length}` : "Mostrar reglas", () => send(x => { x.view = "reglas"; x.slide = v === "reglas" ? k : 0; }, false), v === "reglas" ? "on" : ""),
    b("Siguiente ▶", () => send(x => { x.view = "reglas"; x.slide = Math.min(T.SLIDES.length - 1, v === "reglas" ? k + 1 : 0); }, false), "", v === "reglas" && k === T.SLIDES.length - 1)));
  const views = [["auto", "Automático"], ["general", "Tabla general"], ["partida", "Partida actual"], ["calendario", "Calendario"], ["podio", "Podio"]];
  box.append(h("h3", {}, "Qué se ve"), h("div", { class: "mrow" }, views.map(([id, l]) => b(l, () => send(x => { x.view = id; }), v === id ? "on" : ""))));
  const tm = (t.timers || {}).match || {};
  box.append(h("h3", {}, "Partida"), h("div", { class: "mrow" },
    b("Cuenta de 2 min", () => send(x => { x.countdownSeconds = 120; })),
    b(tm.running ? "Pausar cronómetro" : "Iniciar cronómetro", () => send(x => { x.timerCmd = { match: tm.running ? "pause" : "start" }; }))));
  if (msg) box.append(h("p", { class: "note err" }, msg));
  menu.replaceChildren(box); menu.hidden = false;
}
ctlBtn.addEventListener("click", () => { unlockAudio(); renderMenu(); });
menu.addEventListener("click", e => { if (e.target === menu) closeMenu(); else touchMenu(); });

window.__marcadorOk = true;
</script>
<script>setTimeout(function () { if (!window.__marcadorOk) document.getElementById("oldbrowser").hidden = false; }, 2500);</script>
